name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ inputs.build_type }} APK
        run: ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Find APK
        id: apk
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-${{ inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: TV Browser Release v1.0.0-build.${{ github.run_number }}
          files: ${{ steps.apk.outputs.apk_path }}
          body: |
            ## 📦 Android TV Browser - Release Build
            
            **Build Information:**
            - Build Number: `${{ github.run_number }}`
            - Build Type: Release
            - Commit: `${{ github.sha }}`
            
            **Features:**
            ✅ YouTube Ad Blocker
            ✅ Multi-layer Ad Blocking
            ✅ Full Settings Control
            ✅ TV-Optimized UI
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "✅ Build Complete!"
          echo "📦 APK: ${{ steps.apk.outputs.apk_name }}"
          echo "🔗 Download from Artifacts or Releases tab"
