name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Build ${{ inputs.build_type }} APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found. Available files:"
            find app/build/outputs -type f -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-${{ inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: TV Browser Release v1.0.0-build.${{ github.run_number }}
          files: ${{ steps.apk.outputs.apk_path }}
          body: |
            ## Android TV Browser - Release Build

            Build #${{ github.run_number }}

            ### APK
            `${{ steps.apk.outputs.apk_name }}` is attached below.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
