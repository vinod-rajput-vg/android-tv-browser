name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ inputs.build_type }} APK
        run: ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: tv-browser-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          retention-days: 30
